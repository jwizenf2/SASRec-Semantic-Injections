# Table 5 rows 5-6 / Figure 3 — Frequency-weighted InfoNCE alignment.
# Binary weighting: 2x for tail items, 0.5x for head items, 1x for torso.
# λ=0.5.
#
# Row 5 (Xavier init + freq-weighted) — Table 5 row 5:
#   uv run python sasrec_injection/scripts/train_item_table.py \
#     --config sasrec_injection/configs/decomposition/freq_weighted_alignment.yaml \
#     --seeds 42 7 18 --freq-weight --weight-fn binary
#
# Row 6 (LLM-PCA init + freq-weighted = our full method) — Table 5 row 6:
#   uv run python sasrec_injection/scripts/train_item_table.py \
#     --config sasrec_injection/configs/decomposition/freq_weighted_alignment.yaml \
#     --seeds 42 7 18 --llm-init --freq-weight --weight-fn binary
dataset:
  name: "amazon-Video_Games"
  min_interactions: 5
model:
  embed_dim: 50
  num_blocks: 2
  num_heads: 1
  max_seq_len: 200
  dropout: 0.2
training:
  batch_size: 512
  lr: 0.001
  max_epochs: 200
  early_stopping_patience: 10
  early_stopping_metric: "ndcg@10"
  early_stopping_min_delta: 0.0001
evaluation:
  num_neg_samples: 100
  ks: [5, 10, 20]
align:
  embeddings_path: "sasrec_injection/outputs/embeddings/video_games.pt"
  lambda_align: 0.5
  temperature: 0.1
  projector_hidden_dim: 0
  projector_dropout: 0.1
  llm_dim: 1024
  max_align_ids: 4096
seeds: [42, 7, 18]
output_dir: "sasrec_injection/outputs/decomposition/freq_weighted_alignment"
