# Appendix D — Alignment weight λ sweep on Video Games.
# Sweeps λ ∈ {0.01, 0.05, 0.1, 0.5, 1.0} with LLM-PCA init + log frequency weighting.
#
# Run: uv run python sasrec_injection/scripts/train_item_table.py \
#        --config sasrec_injection/configs/appendix/lambda_sweep.yaml \
#        --seeds 42 7 18 --llm-init --freq-weight \
#        --lambdas 0.01 0.05 0.1 0.5 1.0
dataset:
  name: "amazon-Video_Games"
  min_interactions: 5
model:
  embed_dim: 50
  num_blocks: 2
  num_heads: 1
  max_seq_len: 200
  dropout: 0.2
training:
  batch_size: 512
  lr: 0.001
  max_epochs: 200
  early_stopping_patience: 10
  early_stopping_metric: "ndcg@10"
  early_stopping_min_delta: 0.0001
evaluation:
  num_neg_samples: 100
  ks: [5, 10, 20]
align:
  embeddings_path: "sasrec_injection/outputs/embeddings/video_games.pt"
  lambda_align: 0.1
  temperature: 0.1
  projector_hidden_dim: 0
  projector_dropout: 0.1
  llm_dim: 1024
  max_align_ids: 4096
seeds: [42, 7, 18]
output_dir: "sasrec_injection/outputs/appendix/lambda_sweep"
