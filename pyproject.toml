[project]
name = "sailrec"
version = "0.1.0"
description = "Where LLM Knowledge Belongs: semantic injection surfaces in SASRec-style sequential recommendation"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.2",
    "mlx-lm>=0.20",
    "pyyaml>=6.0",
    "pandas>=2.0",
    "scipy>=1.12",
    "requests>=2.31",
    "wandb>=0.16",
    "datasets>=2.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sailrec/src/sailrec"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
