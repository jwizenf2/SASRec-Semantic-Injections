# Table 3 / Appendix B — Surface B: Per-position encoder output distillation on Video Games.
# InfoNCE between encoder hidden state at each position and the projected LLM embedding
# of the target item. λ=0.1 selected on VG NDCG@10.
# Run: uv run python sailrec/scripts/train_a3_hidden_distill.py \
#        --config sailrec/configs/cross_surface/surface_b_per_position_distill.yaml \
#        --seeds 42 7 18
dataset:
  name: "amazon-Video_Games"
  min_interactions: 5
model:
  embed_dim: 50
  num_blocks: 2
  num_heads: 1
  max_seq_len: 200
  dropout: 0.2
training:
  batch_size: 512
  lr: 0.001
  max_epochs: 200
  early_stopping_patience: 10
  early_stopping_metric: "ndcg@10"
  early_stopping_min_delta: 0.0001
evaluation:
  num_neg_samples: 100
  ks: [5, 10, 20]
align:
  embeddings_path: "sailrec/outputs/embeddings/video_games.pt"
  lambda_align: 0.1
  temperature: 0.1
  projector_hidden_dim: 0
  projector_dropout: 0.1
  llm_dim: 1024
  max_align_ids: 4096
seeds: [42, 7, 18]
output_dir: "sailrec/outputs/cross_surface/surface_b_per_position_distill"
