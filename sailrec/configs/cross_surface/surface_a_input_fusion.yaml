# Table 3 / Appendix B — Surface A: Encoder input fusion on Video Games.
# LLM embeddings concatenated to SASRec input at every forward pass.
# Run: uv run python sailrec/scripts/train_a2_input_fusion.py \
#        --config sailrec/configs/cross_surface/surface_a_input_fusion.yaml \
#        --seeds 42 7 18
dataset:
  name: "amazon-Video_Games"
  min_interactions: 5
model:
  embed_dim: 50
  num_blocks: 2
  num_heads: 1
  max_seq_len: 200
  dropout: 0.2
training:
  batch_size: 512
  lr: 0.001
  max_epochs: 200
  early_stopping_patience: 10
  early_stopping_metric: "ndcg@10"
  early_stopping_min_delta: 0.0001
evaluation:
  num_neg_samples: 100
  ks: [5, 10, 20]
seeds: [42, 7, 18]
output_dir: "sailrec/outputs/cross_surface/surface_a_input_fusion"
llm_embeddings_path: "sailrec/outputs/embeddings/video_games.pt"
